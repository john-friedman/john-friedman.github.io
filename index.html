<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Friedman - Profile</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .profile-container {
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .profile-picture {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border: 6px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .social-links a {
            color: #495057;
            font-size: 1.8rem;
            margin: 0 15px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: #0d6efd;
            transform: translateY(-3px);
        }

        h1 {
            font-weight: 700;
            color: #1a1a1a;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4a4a4a;
        }

        .fun-fact {
            font-size: 1rem;
            color: #6c757d;
            margin-top: 15px;
        }

        .fun-fact a {
            color: #495057;
            text-decoration: none;
            border-bottom: 1px dotted #495057;
        }

        .fun-fact a:hover {
            color: #0d6efd;
            border-bottom-color: #0d6efd;
        }
        
        /* Clean, simple link styling */
        .clean-link {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-bottom-color 0.2s ease;
        }
        
        .clean-link:hover {
            border-bottom-color: #0d6efd;
        }
    </style>
</head>

<body>
    <div class="container profile-container">
        <div class="row align-items-center">
            <div class="col-md-4 text-center mb-4 mb-md-0">
                <img src="src/john.jpg" alt="John Friedman" class="rounded-circle profile-picture img-fluid">
            </div>
            <div class="col-md-8">
                <h1 class="mb-3">John Friedman</h1>
                <p class="mb-2">
                    Hi, I'm John. I'd like to understand the world better. Previously, I was a PhD student in economics at UCLA & before that
I was a researcher at MIT & Berkeley.
                </p>
                <p>Currently working on <a href='https://datamule.xyz' class="clean-link">datamule</a>.</p>
                <p class="fun-fact">
                    Fun Fact: My Erdős number is 4, and <a
                        href="https://www.frontiersin.org/journals/public-health/articles/10.3389/fpubh.2020.00266/full"
                        target="_blank">I've coauthored with a Nobel Prize winner.</a>
                </p>
            </div>
        </div>

        <hr class="my-4">
        <div class="social-links text-center">
            <a href="https://github.com/john-friedman" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="https://www.linkedin.com/in/johngfriedman/" target="_blank" title="LinkedIn"><i
                    class="fab fa-linkedin"></i></a>
            <a href="mailto:jgfriedman99@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>

</html>
